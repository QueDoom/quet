plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
	id "com.modrinth.minotaur" version "2.+"
}

def dotenv = [:]
def envFile = file('.env')
if (envFile.exists()) {
	envFile.eachLine { line ->
		def m = line =~ /^\s*([^#=\s]+)\s*=\s*(.*?)\s*$/
		if (m) dotenv[m[0][1]] = m[0][2]
	}
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()
	withJavadocJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

modrinth {
	token = dotenv['MODRINTH_TOKEN'] ?: System.getenv("MODRINTH_TOKEN")
	projectId = project.namespace
	versionNumber = project.version
	versionType = "release"
	uploadFile = tasks.jar
	additionalFiles = [tasks.sourcesJar]
	gameVersions = [project.minecraft_version]
	loaders = ["fabric"] // Must also be an array
	dependencies {
		required.project "fabric-api"
	}
}



repositories {
	exclusiveContent {
		forRepository {
			maven {
				name = "Cassian's Maven"
				url = uri("https://maven.cassian.cc")
			}
		}
		filter {
			includeGroupAndSubgroups("cc.cassian")
		}
	}
}

publishing {
}

loom {
	accessWidenerPath = file("src/main/resources/quet.classtweaker")
}

fabricApi {
	configureDataGeneration {
		client = true
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	implementation("cc.cassian.rrv:reliable-recipe-viewer-fabric:${rrv_version}+${minecraft_version}")
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

